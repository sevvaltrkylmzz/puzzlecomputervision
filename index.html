<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reCAPTCHA Doğrulama</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- LANDING — reCAPTCHA "I'm not a robot" -->
    <div id="screen-landing" class="screen active">
        <div class="recaptcha-wrapper">
            <div class="recaptcha-box">
                <div class="recaptcha-left">
                    <div class="checkbox-wrapper" id="captcha-checkbox">
                        <div class="checkbox">
                            <svg class="checkmark-svg hidden" viewBox="0 0 24 24" fill="none" stroke="#4285f4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="4 12 9 17 20 7"/>
                            </svg>
                        </div>
                    </div>
                    <span class="recaptcha-label">Ben robot değilim</span>
                </div>
                <div class="recaptcha-right">
                    <div class="recaptcha-logo">
                        <svg viewBox="0 0 64 64" width="32" height="32">
                            <path d="M32 2a30 30 0 0 1 0 60" fill="none" stroke="#4285f4" stroke-width="4"/>
                            <path d="M32 2a30 30 0 0 0 0 60" fill="none" stroke="#ccc" stroke-width="4"/>
                            <path d="M32 12v20l14 8" fill="none" stroke="#4285f4" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="recaptcha-brand">reCAPTCHA</span>
                    <span class="recaptcha-terms">Gizlilik - Şartlar</span>
                </div>
            </div>
            <div class="robot-image-wrapper">
                <img src="asset/robot.jpg" alt="Robot" class="robot-image">
            </div>
        </div>
    </div>

    <!-- CAMERA -->
    <div id="screen-camera" class="screen">
        <div class="camera-container">
            <video id="webcam" autoplay playsinline></video>
            <div id="countdown-overlay" class="countdown-overlay hidden">
                <span id="countdown-number"></span>
            </div>
            <div id="flash-overlay" class="flash-overlay"></div>
        </div>
        <button id="btn-capture" class="btn-capture">
            <span class="pulse-ring"></span>
        </button>
    </div>

    <!-- PUZZLE (reCAPTCHA challenge style) -->
    <div id="screen-puzzle" class="screen">
        <div class="challenge-widget">
            <div class="challenge-header">
                Devam etmek için bulmacayı tamamla
            </div>
            <div class="challenge-body">
                <div class="puzzle-grid-container" id="puzzle-grid-container">
                    <div id="puzzle-grid" class="puzzle-grid"></div>
                    <div id="hand-cursor" class="hand-cursor"></div>
                </div>
                <div class="challenge-side">
                    <canvas id="reference-image"></canvas>
                    <div class="challenge-timer">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span id="timer-display">00:00</span>
                    </div>
                    <div class="hand-preview">
                        <video id="hand-video" autoplay playsinline></video>
                        <div id="hand-status" class="hand-status">✋ Yükleniyor...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CONGRATS -->
    <div id="screen-congrats" class="screen">
        <div class="challenge-widget congrats-widget">
            <div class="challenge-header congrats-header">
                ✅ Tamamlandı!
            </div>
            <div class="congrats-body">
                <div class="congrats-stats">
                    <span>Süren: <strong id="final-time">00:00</strong></span>
                </div>
                <canvas id="completed-image"></canvas>
                <button id="btn-replay" class="btn-replay">Tekrar Dene</button>
            </div>
        </div>
    </div>

    <canvas id="capture-canvas" style="display:none;"></canvas>
    <div id="confetti-container" class="confetti-container"></div>

    <script src="app.js"></script>
</body>
</html>
